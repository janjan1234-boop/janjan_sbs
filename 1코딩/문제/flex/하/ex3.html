<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex3</title>
</head>
<!-- css는 style 태그 안에 있습니다. 해당 태그를 열어서 문제를 확인해주세요. -->
<!-- 문제: 해당 이미지의 1box, 2box, 3box가 세로정렬로 되어 있습니다. 가로정렬이 되도록 수정하고 점선끼리 맞닿은 채 이미지 우측 아래로 이동시켜주세요. -->
    <style>

      .container {
        margin: 0 auto;
        width: 1000px;
        height: 700px;
        background-color: beige;
        border: 1px solid chocolate;
        /*해설1: .box1, .box2, .box3의 부모요소인 .container안에 flex를 넣어 가로정렬이 되도록 해줍니다.*/
        display: flex;
        /*해설2: flex를 주면 가로정렬이 되지만 왼쪽으로 치우쳐 배치됩니다. justify-content: right; 혹은 
        justify-content: end;를 넣어 우측으로 배치되도록 합니다.*/
        justify-content: right;
        /*해설3: 이제는 우측 아래로 옮겨야 합니다. align-items: end; 혹은 align-items: flex-end;를 사용하여 아래로 배치되도록 합니다.*/
        align-items: end;
      }

      .box1, .box2, .box3 {
          text-align: center;
          line-height: 200px;
          width: 200px;
          height: 200px;
          border: 2px solid chocolate;
          background-color: blanchedalmond;
          color: chocolate;
      }

      .box1{
        border-right-style: dashed;
      }
      .box2{
        border-left-style: dashed;
        border-right-style: dashed;
      }
      .box3{
        border-left-style: dashed;
}
    </style>  
<body>
    <div class="container">
  <div class="box1">1</div>
  <div class="box2">2</div>
  <div class="box3">3</div>
</div>
</body>
</html>
