<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>start1</title>
</head>
<!-- css는 style 태그 안에 있습니다. 해당 태그를 열어서 문제를 확인해주세요. -->
<!-- 문제: 해당 이미지의 왼쪽과 오른쪽이 세로정렬이 아니라 가로정렬되어 점선부분이 붙을 수 있도록 style을 수정해주세요 -->
    <style>

.container {
  margin: 0 auto;
  width: 1000px;
  height: 700px;
  background-color: beige;
  border: 1px solid chocolate;
  justify-content: space-between;
}

.left, .right {
    text-align: center;
    line-height: 300px;
    width: 300px;
    height: 300px;
    border: 2px solid chocolate;
    background-color: blanchedalmond;
    color: chocolate;
}

.left {
  border-right-style: dashed;
  
}

.right {
  border-left-style: dashed;
}
    </style>
   
<body>
    <div class="container">
  <div class="left">왼쪽</div>
  <div class="right">오른쪽</div>
</div>
</body>
</html>
